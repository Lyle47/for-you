<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>
  <style>
    :root {
      --bg: #f8f6f2;
      --card-bg: #ffffff;
      --text-main: #2b2b2b;
      --accent: #d97762;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(#e5e0d8 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
      overflow-x: hidden;
      user-select: none;
    }

    .container {
      perspective: 1200px;
      max-width: 420px;
      width: 100%;
    }

    /* Flip Card Setup */
    .card-wrap {
      position: relative;
      width: 100%;
      height: 560px;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      cursor: pointer;
    }

    .card-wrap.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 4px;
      background: var(--card-bg);
      box-shadow: 0 18px 40px var(--shadow), 0 4px 12px rgba(0, 0, 0, 0.04);
      padding: 20px 20px 28px 20px;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    /* Front side: Polaroid */
    .front {
      transform: rotateY(0deg);
    }

    .img-container {
      width: 100%;
      flex-grow: 1;
      border-radius: 2px;
      overflow: hidden;
      background: #eee;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      margin-top: 18px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.02em;
    }

    .hint {
      margin-top: 4px;
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Back side: Note */
    .back {
      transform: rotateY(180deg);
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .back-content h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: var(--accent);
      font-weight: 600;
    }

    .back-content p {
      font-size: 1rem;
      line-height: 1.7;
      color: #555;
      margin-bottom: 20px;
    }

    .signature {
      font-weight: 600;
      color: var(--text-main);
      font-size: 1.05rem;
    }

    /* Particles */
    .particle {
      position: fixed;
      pointer-events: none;
      animation: floatUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      font-size: 20px;
      z-index: 100;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.6);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.2);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-wrap" id="card">
      <!-- FRONT FACE -->
      <div class="face front">
        <div class="img-container">
          <!-- Replace art.png with your image file name in the repo -->
          <img src="art.png" alt="Illustration" />
        </div>
        <div class="caption">Gera-Leigh & Harper</div>
        <div class="hint">Tap to flip</div>
      </div>

      <!-- BACK FACE -->
      <div class="face back">
        <div class="back-content">
          <h2>Just Because</h2>
          <p>
            A quick reminder of how much you mean to me. Every moment, every laugh, and everything ahead.
          </p>
          <div class="signature">— Lyle</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');

    card.addEventListener('click', (e) => {
      card.classList.toggle('flipped');
      createSparkle(e.clientX, e.clientY);
    });

    function createSparkle(x, y) {
      const symbols = ['✦', '✧', '♥', '•'];
      for (let i = 0; i < 6; i++) {
        const span = document.createElement('span');
        span.className = 'particle';
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = `${x}px`;
        span.style.top = `${y}px`;
        span.style.color = '#d97762';

        const tx = (Math.random() - 0.5) * 120 + 'px';
        const ty = (Math.random() * -100 - 30) + 'px';
        span.style.setProperty('--tx', tx);
        span.style.setProperty('--ty', ty);

        document.body.appendChild(span);
        setTimeout(() => span.remove(), 1200);
      }
    }
  </script>
</body>
</html>
