<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Gera-Leigh</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --card-bg: #ffffff;
      --text-main: #242424;
      --accent: #c46855;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image: radial-gradient(#e2ddd5 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      user-select: none;
      overflow-x: hidden;
    }

    .container {
      perspective: 1200px;
      max-width: 400px;
      width: 100%;
    }

    /* Flip Card Animation */
    .card-wrap {
      position: relative;
      width: 100%;
      height: 560px;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.34, 1.2, 0.64, 1);
      cursor: pointer;
    }

    .card-wrap.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 6px;
      background: var(--card-bg);
      box-shadow: 0 20px 45px var(--shadow), 0 4px 12px rgba(0, 0, 0, 0.03);
      padding: 20px 20px 28px 20px;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    /* Front */
    .front {
      transform: rotateY(0deg);
    }

    .img-box {
      width: 100%;
      flex-grow: 1;
      border-radius: 3px;
      overflow: hidden;
      background: #ece7de;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      margin-top: 18px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 0.02em;
    }

    .hint {
      margin-top: 4px;
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Back */
    .back {
      transform: rotateY(180deg);
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 44px 28px;
    }

    .header-tag {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .quote-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 0;
    }

    .quote-text {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #3b3b3b;
      font-style: italic;
      position: relative;
    }

    .quote-text::before {
      content: "“";
      font-size: 3rem;
      color: var(--accent);
      opacity: 0.3;
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-style: normal;
    }

    .signature-box {
      margin-top: 10px;
    }

    .signature {
      font-weight: 600;
      color: var(--text-main);
      font-size: 1.05rem;
    }

    .subhint {
      margin-top: 8px;
      font-size: 0.72rem;
      color: #aaa;
    }

    /* Floating Particles */
    .particle {
      position: fixed;
      pointer-events: none;
      animation: rise 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      font-size: 18px;
      z-index: 100;
    }

    @keyframes rise {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.6);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(1.2);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-wrap" id="card">
      <!-- FRONT -->
      <div class="face front">
        <div class="img-box">
          <!-- Place your drawing/photo in repo as art.png -->
          <img src="art.png" alt="Gera-Leigh" />
        </div>
        <div class="caption">Gera-Leigh</div>
        <div class="hint">Tap to see your note</div>
      </div>

      <!-- BACK -->
      <div class="face back">
        <div class="header-tag">A Note For You</div>
        <div class="quote-content">
          <p class="quote-text" id="quoteText"></p>
        </div>
        <div class="signature-box">
          <div class="signature">— Lyle</div>
          <div class="subhint">Tap to flip back</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const quotes = [
      "Just a reminder of how effortlessly you brighten up everything around you.",
      "The world is noisy, but having you in it makes everything settle into place.",
      "You don't need to try—your presence alone changes the room.",
      "Thank you for being my favorite constant through every busy day.",
      "You make even the quietest, ordinary moments feel memorable.",
      "I appreciate every little thing you do, even the things you think go unnoticed.",
      "Never forget how capable, grounded, and genuinely special you are.",
      "Simply checking in to say: you're doing incredible, and I've got your back always."
    ];

    let remainingQuotes = [...quotes];

    function getRandomQuote() {
      if (remainingQuotes.length === 0) {
        remainingQuotes = [...quotes];
      }
      const index = Math.floor(Math.random() * remainingQuotes.length);
      return remainingQuotes.splice(index, 1)[0];
    }

    const card = document.getElementById('card');
    const quoteText = document.getElementById('quoteText');

    // Set initial quote on page load
    quoteText.textContent = getRandomQuote();

    card.addEventListener('click', (e) => {
      const willBeFlipped = !card.classList.contains('flipped');
      card.classList.toggle('flipped');

      // Swap to a new quote every time she flips back to the front
      if (!willBeFlipped) {
        setTimeout(() => {
          quoteText.textContent = getRandomQuote();
        }, 300);
      }

      triggerBurst(e.clientX, e.clientY);
    });

    function triggerBurst(x, y) {
      const icons = ['✦', '✧', '♥', '•'];
      for (let i = 0; i < 6; i++) {
        const span = document.createElement('span');
        span.className = 'particle';
        span.textContent = icons[Math.floor(Math.random() * icons.length)];
        span.style.left = `${x}px`;
        span.style.top = `${y}px`;
        span.style.color = '#c46855';

        const tx = (Math.random() - 0.5) * 110 + 'px';
        const ty = (Math.random() * -90 - 25) + 'px';
        span.style.setProperty('--tx', tx);
        span.style.setProperty('--ty', ty);

        document.body.appendChild(span);
        setTimeout(() => span.remove(), 1100);
      }
    }
  </script>
</body>
</html>
